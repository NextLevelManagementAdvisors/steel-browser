<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worker Network Fixture</title>
  </head>
  <body>
    <main>
      <h1>Worker Network Fixture</h1>
      <p id="status" role="status">Starting worker...</p>
      <form id="contact-form">
        <label>Email <input id="email" name="email" type="email" required /></label>
        <button type="submit">Send</button>
      </form>
    </main>
    <script>
      const status = document.querySelector("#status");
      const workers = [];
      const startWorker = (kind) => {
        const worker = new Worker(`/worker.js?kind=${kind}`);
        workers.push(worker);
        worker.onmessage = ({ data }) => {
          status.textContent = data.type;
          window.workerFingerprint = data.fingerprint;
        };
        worker.onerror = () => {
          status.textContent = "worker-error";
        };
      };
      startWorker("bootstrap");
      document.querySelector("#contact-form").addEventListener("submit", (event) => {
        event.preventDefault();
        startWorker("submit");
      });
    </script>
  </body>
</html>
